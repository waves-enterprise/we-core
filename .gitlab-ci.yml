image: ${REGISTRY}/it/docker:19.03.1

services:
  - name: ${REGISTRY}/it/docker:20.10.21-dind
    alias: docker

variables:
  GIT_STRATEGY: "clone"

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages:
  - compile
  - test
  - publish
  - scan

### Scaning
.image_scanning:
  stage: scan
  image:
    name: docker.io/aquasec/trivy:0.22.0
    entrypoint: [""]
  variables:
    # No need to clone the repo, we exclusively work on artifacts.  See
    # https://docs.gitlab.com/ee/ci/runners/README.html#git-strategy
    GIT_STRATEGY: none
    #  DOCKER_HOST: tcp://docker:2375
    TRIVY_USERNAME: "$TRIVY_REGISTRY_USER"
    TRIVY_PASSWORD: "$TRIVY_REGISTRY_PASSWORD"
    #  TRIVY_AUTH_URL: "$CI_REGISTRY"
    FULL_IMAGE_NAME: ${REGISTRY}/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:${CI_COMMIT_REF_NAME}
  script:
    - trivy --version
    # cache cleanup is needed when scanning images with the same tags, it does not remove the database
    - time trivy image --clear-cache
    # update vulnerabilities db
    - time trivy --download-db-only --no-progress --cache-dir .trivycache/
    # Builds report and puts it in the default workdir $CI_PROJECT_DIR, so `artifacts:` can take it from there
    - time trivy --exit-code 0 --cache-dir .trivycache/ --no-progress --format template --template "@/contrib/gitlab.tpl"
      --output "$CI_PROJECT_DIR/gl-container-scanning-report.json" "$FULL_IMAGE_NAME"
    # Prints full report
    - time trivy --exit-code 0 --cache-dir .trivycache/ --no-progress "$FULL_IMAGE_NAME"
    # Fail on high vulnerabilities
    - time trivy --exit-code 0 --cache-dir .trivycache/ --severity HIGH --no-progress "$FULL_IMAGE_NAME"
    # Fail on critical vulnerabilities
    - time trivy --exit-code 0 --cache-dir .trivycache/ --severity CRITICAL --no-progress "$FULL_IMAGE_NAME"
  cache:
    paths:
      - .trivycache/
  # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/ (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  artifacts:
    when:                          always
    reports:
      container_scanning:          gl-container-scanning-report.json

.create-environment: &create-environment
  image: ${REGISTRY}/it/hseeberger/scala-sbt:11.0.14.1_1.6.2_2.12.15
  tags:
    - wavesenterprise
  before_script:
    - cat "$SBT_CREDENTIALS" > /root/.sbt/.credentials

### Compile jobs
compile:
  <<: *create-environment
  stage: compile
  script:
    - sbt 'version; scalafmtCheckAll; compile; Test / compile'
  artifacts:
    paths:
      - "target"
      - "project/target"
      - "project/project/target"
      - "*/target"
      - "*/project/target"
      - "*/project/project/target"
      - "*/*/target"
      - "*/*/project/target"
      - "*/*/project/project/target"
    expire_in: 3 day

### Testing jobs
test-core:
  <<: *create-environment
  stage: test
  script:
    - sbt -mem 2048 test
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    NODE_HOST: docker
  cache: [ ]
  artifacts:
    reports:
      junit:
        - target/test-reports/*.xml
        - lang/jvm/target/test-reports/*.xml
  dependencies:
    - compile

dependency_scanning:
  stage: test
  artifacts:
    reports:
      dependency_scanning: gl-dependency-scanning-report.json

publish-nexus-artifacts:
  <<: *create-environment
  stage: publish
  needs:
    - compile
    - test-core
  script:
    - cat "$SBT_CREDENTIALS_SONATYPE" > /root/.sbt/.sonatype-credentials
    - echo $PGP_KEY | base64 --decode > pgp.key && gpg --batch --import pgp.key
    - sbt -mem 2048 core/publishSigned
  cache: [ ]
  only:
    - tags
    - branches
  dependencies:
    - compile

trivy_scan:
  stage: scan
  extends:
    .image_scanning
  # only: "is it necessary or not necessary, that's the question"
  #   - /^.*RC.*$/
  #   - /^.*release.*$/
  #   - /^.*raritet.*$/
  #   - master
  #   - tags
  tags:
    - wavesenterprise
    - node